services:
  db:
    image: postgres:16
    container_name: tutor_match_db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tutor_match}
      POSTGRES_USER: ${DB_USERNAME:-tutor}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?copier .env.example vers .env}"
    ports:
      - "127.0.0.1:5432:5432" # base joignable uniquement depuis la machine locale
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
